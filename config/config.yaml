# =====================================================================
#  Голосовой ассистент по законодательству Eclipse RP
#  Файл настроек. Меняется вручную, применяется при перезапуске.
# =====================================================================

# ---------------------------------------------------------------------
# ПРОФИЛЬ ЖЕЛЕЗА
#   cpu_only  — запасной: всё на CPU, вся видеопамять игре. Держать
#               как страховку, если GPU-профиль начнёт мешать игре.
#   gpu_5080  — рабочий: Whisper и модель на RTX 5080 рядом с GTA.
#   heavy     — GTA закрыта, вся карта модели: оформление документов
#               и разбор дел. Включать вручную.
# ---------------------------------------------------------------------
active_profile: gpu_5080

# Какой профиль брать, когда видеопамяти мало. Карта одна и делится
# с игрой: при запущенной GTA свободными остаются считанные сотни
# мегабайт, и обычный профиль работает в разы медленнее, чем должен.
hardware:
  # Лестница профилей по свободной видеопамяти, сверху вниз. Берётся
  # первый, которому хватает места. Замеры на 5080 при запущенной GTA:
  #   всё на карте          7B 4.4 + Whisper 1.5 + bge 0.6 + буферы
  #   поиск на процессоре   те же минус 0.6
  #   модель поменьше       4B 2.5 вместо 7B
  memory_ladder:
    - profile: gpu_5080
      needs_mb: 7000
    - profile: gpu_tight
      needs_mb: 5600
    - profile: game_max
      needs_mb: 0

profiles:

  cpu_only:
    description: "Временный профиль: одна GPU (3060 Ti) отдана GTA, AI на CPU"
    stt:
      model: small            # faster-whisper: tiny/base/small/medium
      device: cpu
      device_index: 0
      compute_type: int8
      cpu_threads: 8          # из 16 доступных, чтобы не душить игру
    llm:
      # ВАЖНО: именно instruct-вариант, без режима рассуждений.
      # Обычный qwen3:4b — гибридная think-модель: она тратит 600-1300
      # токенов на рассуждения перед каждым ответом, это +30..300 секунд
      # на CPU. Отключить их не удалось: "think": false в Ollama 0.32.15
      # ломает разбор ответа, а директива /no_think игнорируется.
      model: qwen3:4b-instruct
      num_gpu: 0              # 0 = ни одного слоя на GPU, вся VRAM игре
      # num_ctx обязателен: без него Ollama берёт полное окно модели
      # (у qwen3 это 262144) и пытается выделить под KV-кеш ~35 ГБ,
      # после чего процесс падает с ошибкой выделения памяти.
      num_ctx: 8192
    embeddings:
      model: bge-m3           # пока заглушка, подключается на Этапе 2
      device: cpu

  gpu_tight:
    description: "Игра запущена, но памяти хватает на семёрку"
    # Между полным профилем и облегчённым: модель и распознавание
    # те же, что обычно, а поиск уходит на процессор — его полгигабайта
    # как раз и решают, влезет ли семёрка целиком.
    stt:
      model: medium
      device: cuda
      device_index: 0
      compute_type: float16
      cpu_threads: 4
      beam_size: 5
    llm:
      model: qwen2.5:7b-instruct
      num_gpu: 999
      num_ctx: 8192
    embeddings:
      # Короткий запрос считается на процессоре за доли секунды.
      model: bge-m3
      device: cpu

  game_max:
    description: "GTA Enhanced на максималках: боту остаётся 3-4 ГБ VRAM"
    # Enhanced на ультрах забирает 12+ ГБ из 16, и обычный профиль
    # перестаёт помещаться: 7B (4.8) + Whisper medium (1.5) + bge-m3
    # (0.6) — это семь гигабайт против трёх свободных. Ollama начинает
    # держать часть слоёв в системной памяти, и ответ, который считался
    # секунду, растягивается на десятки секунд.
    #
    # Поэтому здесь всё ужато под три гигабайта:
    #   qwen3:4b-instruct   2.5 ГБ   (вместо 4.8)
    #   bge-m3              0.6 ГБ   (нужен поиску, остаётся на карте)
    #   Whisper small       0 ГБ     (уходит на процессор целиком)
    stt:
      # Распознавание остаётся medium и на карте. Пробовали иначе:
      # small на процессоре превращал «меня задержал сотрудник LSPD»
      # в «мне задержался трудник ЛСПД», и бот отвечал не на тот
      # вопрос — это хуже, чем медленный ответ. Medium на процессоре
      # тоже не годится: замер дал 9 секунд на пятисекундную фразу.
      # Полтора гигабайта видеопамяти — честная цена за то, что бот
      # вообще понимает вопрос.
      model: medium
      device: cuda
      device_index: 0
      compute_type: float16
      cpu_threads: 4
      beam_size: 5
    llm:
      # qwen3:4b-instruct, а не обычный qwen3:4b: тот гибридный и
      # тратит сотни токенов на рассуждения перед каждым ответом.
      model: qwen3:4b-instruct
      num_gpu: 999
      # Окно меньше обычного, но не вдвое: промпт экзамена с выдержками
      # занимает около 4100 токенов, и при 4096 Ollama отвечала 400 —
      # экзамен в этом профиле просто не работал. 6144 оставляет запас
      # и стоит лишних полторы сотни мегабайт KV-кеша.
      num_ctx: 6144
    embeddings:
      # На процессоре: короткий запрос считается за доли секунды, а
      # полгигабайта видеопамяти уходят основной модели. Без этого
      # 4B (3.2 ГБ) плюс bge-m3 (0.6) не помещались в три свободных,
      # и драйвер вытеснял страницы — ответ считался полторы минуты.
      model: bge-m3
      device: cpu

  gpu_5080:
    description: "RTX 5080 одна на всё: и игра, и AI-стек"
    # ТЗ предполагало две карты — 3060 Ti игре, 5080 под AI. Фактически
    # в системе одна 5080 на 16 ГБ, и делить её приходится с GTA.
    # Отсюда все решения ниже: не «занять всё, что есть», а уместиться
    # рядом с игрой.
    stt:
      # На GPU не жалко взять medium вместо small: он заметно точнее на
      # юридических терминах, а именно распознавание было главным
      # источником неправильных ответов («хладность», «дрожжном»,
      # «поцсуальному»). В float16 занимает около 1.5 ГБ.
      model: medium
      device: cuda
      device_index: 0         # карта одна, индекс нулевой
      compute_type: float16
      cpu_threads: 4
      # На процессоре широкий луч стоил секунд, поэтому стоял 1 —
      # и именно жадный декодер путал «халатность» с «хладностью»,
      # «дорожном» с «дрожжном». На 5080 замер показал сотые доли
      # секунды на восьмисекундном фрагменте: точность теперь
      # бесплатна, и брать узкий луч незачем.
      beam_size: 5
    llm:
      # 7B, а не 14B — из-за общей с игрой памяти. Расклад на 16 ГБ:
      #   GTA 5 на высоких              6-8 ГБ
      #   Whisper medium float16        ~1.5 ГБ
      #   qwen2.5:7b-instruct + кеш     ~6 ГБ
      # Итого впритык. С 14B (9 ГБ + кеш) игре остаётся 4 ГБ — она
      # начнёт подтормаживать ровно тогда, когда ассистент нужнее
      # всего. 14B ждёт в профиле heavy: он для документов, когда GTA
      # закрыта и всю карту можно отдать модели.
      model: qwen2.5:7b-instruct
      num_gpu: 999            # все слои на GPU
      num_ctx: 8192
    embeddings:
      model: bge-m3
      device: cuda
      device_index: 0

  heavy:
    description: "Офлайн-режим для документов, GTA должна быть закрыта"
    stt:
      model: medium
      device: cuda
      device_index: 0
      compute_type: float16
      cpu_threads: 8
    llm:
      # Для офлайн-оформления документов скорость не критична, поэтому
      # здесь рассуждения не мешают и можно брать большую модель.
      # 14B вместо 32B: 32B в q4 это 20 ГБ, в 16 ГБ карты не влезает.
      # 14B занимает 9 ГБ и при закрытой GTA работает целиком на GPU.
      model: qwen2.5:14b-instruct
      num_gpu: 999
      num_ctx: 16384
    embeddings:
      model: bge-m3
      device: cuda
      device_index: 0

# ---------------------------------------------------------------------
# МОДЕЛЬ ПОД ЗАДАЧУ
#   Быстрые вопросы и тяжёлые бумаги требуют разного. 7B отвечает за
#   секунду и годится, когда вас задерживают. Но структуру документа
#   она держит хуже: теряет ссылки, переписывает статью дословно
#   вместо пересказа. 14B с этим справляется заметно лучше и на 5080
#   выдаёт 85 токенов в секунду — для документа более чем достаточно.
#
#   Одновременно в памяти они не помещаются: 14B это десять гигабайт
#   с лишним, плюс Whisper и буферы CUDA. Поэтому бот переключает их
#   сам и выгружает ненужную. Переключение стоит секунд пятнадцать и
#   приходится на задачи, где вы и так диктуете минуту.
#
#   Пусто — задача считается моделью из профиля железа.
# ---------------------------------------------------------------------
models:
  document: qwen2.5:14b-instruct   # прокурорское дело, судебная бумага
  verdict:  qwen2.5:14b-instruct   # заключение адвоката для суда
  answer:   qwen2.5:7b-instruct    # вопросы в обычном режиме и на экзамене
  # Сколько видеопамяти нужно тяжёлой модели, чтобы она влезла
  # целиком. Не влезает — считаем на быстрой: документ в пять
  # проходов при нехватке памяти растягивается на минуты и
  # выглядит зависшим.
  # Замер по /api/ps: загруженная 14B занимает на карте 9.47 ГБ —
  # это уже вместе с кешем контекста. Порог с запасом: при меньшем
  # месте Ollama грузит её частично в системную память, и пять
  # проходов растягиваются на минуты — со стороны бот выглядит
  # зависшим.
  document_needs_mb: 11500
  verdict_needs_mb: 11500
  whisper_mb: 1500        # столько вернётся при выгрузке распознавания

# ---------------------------------------------------------------------
# LLM RUNTIME
# ---------------------------------------------------------------------
llm:
  backend: ollama
  host: "http://127.0.0.1:11434"
  request_timeout: 180        # секунд; пауза между пакетами ответа
  # Дедлайн на весь потоковый ответ. Нужен отдельно: при стриме
  # Ollama сразу отдаёт заголовки, а потом молча грузит модель
  # с диска — запрос висит, хотя пакеты формально идут.
  stream_timeout: 300
  # Сколько Ollama держит модель загруженной после ответа. По
  # умолчанию пять минут: на экзамене паузы между вопросами как
  # раз такой длины, и каждый второй ответ платил бы сорок секунд
  # за повторную загрузку. Память занята всё время работы бота —
  # это осознанный размен памяти на скорость.
  keep_alive: "2h"
  temperature: 0.2            # юридические ответы — минимум фантазии
  top_p: 0.9
  # Параметр "think" приложению не передаётся намеренно — см. комментарий
  # в core/llm/ollama_client.py. Режим рассуждений выключается не флагом,
  # а выбором модели без него.

# ---------------------------------------------------------------------
# ХОТКЕИ (ТЗ 5.2)
#   Формат: "ctrl+alt+X", "f8", "ctrl+shift+f9", "xbutton1"...
#   PTT-хоткеи работают по удержанию, остальные — по нажатию.
#   Дефолты подобраны так, чтобы не конфликтовать с управлением GTA 5
#   (F-ряд с модификаторами GTA не использует).
# ---------------------------------------------------------------------
hotkeys:
  # Запись голосом — на одиночные клавиши, а не на сочетания: вопрос
  # задают в спешке, одной рукой, не отрывая другую от мыши. В игре
  # CapsLock и Tab ничем не заняты, поэтому бот забирает их себе:
  # пока клавиша зажата, дальше она не идёт.
  ptt_self:       "capslock"     # PTT: мой вопрос (микрофон)
  ptt_other:      "tab"          # PTT: собеседник (loopback GTA5+Discord)
  # Вставить текст из буфера вместо надиктовки: скопировал
  # вопрос или факты откуда угодно — и сразу в бота. Полезно,
  # когда бот не дослушал фразу или текст длинный.
  paste_text:     "ctrl+alt+v"   # вставить текст из буфера
  # Скопировать ответ: окно фокуса не получает, и привычное
  # выделение мышью с ctrl+c в нём не работает — нажатие
  # уходит в игру. Готовый документ иначе не унести.
  copy_answer:    "ctrl+alt+y"   # ответ или документ в буфер
  # Не ctrl+alt+r: это сочетание занято средством скриншотов,
  # и из-за бота нельзя было снять экран. «n» — новая ситуация.
  reset_session:  "ctrl+alt+n"   # сброс контекста сессии
  cycle_mode:     "ctrl+alt+m"   # обычный -> адвокат -> экзамен
  import_laws:    "ctrl+alt+i"   # импорт правил из буфера обмена
  # Справочный импорт: услуги, прайсы, инструкции, объявления.
  # Нумерации там нет, обычный импорт такие страницы отвергает,
  # а нужны они не меньше правил: ответ про стоимость лечения
  # лежит в прайсе, а не в уставе.
  import_reference: "ctrl+alt+u"
  verdict:        "ctrl+alt+z"   # вынести заключение (режим адвоката)
  start_document: "ctrl+alt+d"   # начать оформление документа
  toggle_overlay: "ctrl+alt+h"   # показать/скрыть оверлей
  expand_answer:  "ctrl+alt+e"   # переспросить модель подробнее
  full_article:   "ctrl+alt+s"   # показать названные статьи дословно
  # Переспрос: та же запись, но декодер считает её шире и точнее.
  # Нужен, когда Whisper расслышал термин неправильно — наговаривать
  # вопрос заново не требуется.
  retry_question: "ctrl+alt+g"   # переспросить последнюю запись
  # Пометка «ответ неверный». Копится в истории, разбирается
  # потом: python tools/history.py --wrong. Уверенно-неправильный
  # ответ опаснее честного «не нашлось», а ловится только так.
  mark_wrong:     "ctrl+alt+x"   # последний ответ неверен
  # Список дел: каждое дело — одна сессия, от сброса до сброса.
  # Открывается мышкой, повторное нажатие возвращает к текущему.
  cases:          "ctrl+alt+c"   # история дел
  search_cases:   "ctrl+alt+f"   # поиск по делам: номер или слово
  toggle_log:     "ctrl+alt+l"   # скрыть/показать лог внизу окна
  # Хоткеев стало больше десятка, в строку подсказки они не влезают.
  # Эта комбинация показывает их все списком прямо в окне.
  help:           "ctrl+alt+f1"  # список всех сочетаний
  # Окно без рамки и без кнопки закрытия, а хоткей скрытия только прячет
  # его. Без этой комбинации выйти можно было бы только через Диспетчер
  # задач. Дублируется пунктом «Выход» в меню значка в трее.
  quit_app:       "ctrl+alt+shift+q"

ptt:
  min_duration_ms: 400          # короче — считаем случайным нажатием
  max_duration_ms: 30000        # предохранитель от зажатой клавиши
  tail_padding_ms: 250          # дописать хвост после отпускания

# ---------------------------------------------------------------------
# АУДИО
# ---------------------------------------------------------------------
audio:
  sample_rate: 16000            # Whisper всё равно ресемплит в 16 кГц
  channels: 1
  input_device: null            # null = устройство Windows по умолчанию
  # ТЗ 2: захват собеседника ограничен строго этими процессами,
  # системный звук целиком не пишется никогда.
  loopback_processes:
    - GTA5.exe
    - GTA5_Enhanced.exe
    - Discord.exe
  # Формат захвата по процессам. Process Loopback не умеет сообщать
  # «родной» формат процесса (GetMixFormat для него не работает), поэтому
  # формат задаём мы, а Windows пересчитывает. 48 кГц стерео — то, в чём
  # работает большинство игр и Discord.
  loopback_sample_rate: 48000
  loopback_channels: 2

stt:
  language: ru
  vad_filter: true              # режем тишину до распознавания
  beam_size: 1                  # 1 = максимальная скорость
  # Ширина луча для переспроса. На CPU-профиле обычный прогон идёт
  # жадным декодером (beam_size: 1), и переспрос считает то же аудио
  # шире. На GPU широкий луч стоит сотые доли секунды, поэтому он там
  # стоит по умолчанию (profiles.gpu_5080.stt.beam_size), и переспрос
  # уже не про ширину, а про вторую попытку как таковую.
  retry_beam_size: 5

  # Подсказка декодеру Whisper. Модель распознаёт обычную русскую речь
  # и юридических терминов почти не ждёт: «халатность» превращалась в
  # «хладность», а дальше ассистент отвечал, что такого в базе нет.
  # Этот текст подаётся как начало разговора, и декодер начинает
  # предпочитать перечисленные слова похожим бытовым.
  #
  # Длина имеет значение: подсказка съедает окно модели, поэтому здесь
  # только то, что реально звучит в вопросах, без полного словаря.
  vocabulary: >-
    Уголовный кодекс, Административный кодекс, Процессуальный кодекс,
    Дорожный кодекс, Трудовой кодекс, статья, пункт, халатность,
    оскорбление представителя власти, превышение должностных полномочий,
    задержание, арест, обыск, досмотр, ордер, прокуратура, адвокат,
    презумпция невиновности, правило Миранды, санкция,
    лишение свободы, штраф, взяточничество, вымогательство, похищение,
    разбой, грабёж, мошенничество, неповиновение, воспрепятствование,
    следственные действия, недопустимые доказательства, видеофиксация,
    розыск, неприкосновенность, делопроизводство, судопроизводство.

# ---------------------------------------------------------------------
# ОВЕРЛЕЙ (ТЗ 5.1)
# ---------------------------------------------------------------------
overlay:
  x: 40
  y: 40
  width: 520
  height: 420
  opacity: 0.88
  font_size: 13
  always_on_top: true
  # WDA_EXCLUDEFROMCAPTURE — не попадать в Display Capture / Discord Screen Share.
  # Процесс при этом остаётся обычным и виден в Диспетчере задач (ТЗ 2).
  exclude_from_capture: true
  # WS_EX_TOOLWINDOW + WS_EX_NOACTIVATE + skip taskbar:
  # окно не появляется отдельной записью в Alt-Tab и не крадёт фокус у игры.
  tool_window: true
  no_activate: true
  click_through: false          # true = мышь проходит насквозь
  # Лог сессии внизу окна. Высота фиксированная и от числа записей
  # не зависит: иначе после десятка вопросов он съедал место,
  # отведённое под сам ответ.
  session_log_lines: 40         # сколько записей помнить (прокрутка)
  log_height: 72                # высота области лога в пикселях
  # Строка с клавишами под шапкой («ctrl+alt+q — вопрос ...»).
  # Скрыта: сочетания запоминаются, а место в окне дороже.
  show_hint: false
  show_log: false                # можно скрыть насовсем

# ---------------------------------------------------------------------
# СЕССИЯ / КОНТЕКСТ (ТЗ 5.7)
# ---------------------------------------------------------------------
# ---------------------------------------------------------------------
# НАСТРОЙКИ ПО РЕЖИМАМ
#   Режимы требуют разного, и один набор параметров на всех означает,
#   что какой-то режим всегда работает хуже, чем мог бы.
#
#   num_predict — потолок длины ответа в токенах. Главный рычаг
#   скорости на CPU: время генерации прямо пропорционально числу
#   токенов, а поиск и качество от этого не страдают вовсе. Ставить
#   меньше, чем нужно режиму, нельзя — ответ оборвётся на полуслове.
#
#   top_k и max_article_chars — сколько статей ищем и насколько
#   подробно подаём каждую. Больше = точнее, но дольше подготовка
#   промпта. 0 означает «как в секции retrieval».
# ---------------------------------------------------------------------
modes:
  normal:
    # Три строки: суть, ссылка, санкция. Ограничение здесь не про
    # скорость, а про место в оверлее поверх игры — его снимать нельзя
    # даже на быстрой карте.
    num_predict: 200
    # Статей в поиск стало больше, и выдержки длиннее: на GPU
    # подготовка промпта почти ничего не стоит, а шанс, что нужная
    # норма попадёт в контекст, выше.
    top_k: 8
    max_article_chars: 1500
    # Перегенерация при выдуманной ссылке раньше была только на
    # экзамене — на процессоре она удваивала минуту ожидания. Теперь
    # ответ считается пару секунд, и платить за точность можно везде.
    retry_on_invented: true
    redact_invented: true

  lawyer:
    # Вопрос сотруднику или разбор его ответа — чуть длиннее обычного,
    # но это всё ещё реплика в задержании, а не лекция.
    num_predict: 320
    top_k: 8
    max_article_chars: 1500
    retry_on_invented: true
    redact_invented: true

  exam:
    # Выдуманная статья на экзамене означает выдуманный ответ — дешевле
    # переспросить модель, чем отдать выдумку. Срабатывает редко,
    # поэтому обычную скорость это не трогает.
    retry_on_invented: true
    # Если и перегенерация не помогла — вычеркнуть ссылку. Проверено
    # на правах задержанного: модель дважды подряд подписала перечень
    # из настоящего права пунктом, которого в базе нет. Пересказ
    # останется, но фальшивый номер до экзаменатора не дойдёт.
    redact_invented: true
    # Два-три предложения плюс ссылка. Раньше стояло 600 «про запас»,
    # и модель охотно их выбирала: 216 токенов ответа при скорости
    # 18 ток/с (карта занята игрой) — это двенадцать секунд на экзамене,
    # где ответ нужен сразу. Перечни в запас всё равно укладываются.
    num_predict: 320
    # Точность в приоритете: берём больше статей и не режем длинные.
    # На экзамене спрашивают полноту перечня, и статья, обрезанная
    # посреди списка случаев, стоит балла.
    top_k: 12
    # Потолок на одну статью держим низким намеренно: важнее, чтобы
    # в контекст попало больше разных статей, чем одна целиком.
    # Длинные всё равно приходят фрагментом — той частью, о которой
    # спросили.
    max_article_chars: 1400

session:
  # Контекст НЕ сбрасывается автоматически — только по хоткею reset_session.
  summarize_after_exchanges: 24   # мягкий лимит: свернуть старое в конспект
  keep_recent_exchanges: 8        # сколько последних обменов оставить дословно

# ---------------------------------------------------------------------
# ПОИСК ПО БАЗЕ (RAG, этап 4)
#   Три способа поиска дополняют друг друга: точный по номеру статьи,
#   смысловой по эмбеддингам и полнотекстовый. Результаты сливаются
#   ранговым слиянием.
# ---------------------------------------------------------------------
retrieval:
  # Сколько статей подкладывать в промпт. Больше — выше шанс поймать
  # нужную, но на CPU-профиле окно модели 8192 токена, и раздутый
  # контекст вытесняет сам вопрос.
  top_k: 6
  # Потолок контекста в символах, по той же причине.
  # 6000 не хватало: две-три длинные статьи съедали весь бюджет, и
  # нужная норма до модели не доходила — на «какие права у
  # задержанного» в контекст не попадала статья 8, где они и
  # перечислены. Окно модели 8192 токена такой объём держит.
  max_context_chars: 9000
  # Потолок на ОДНУ статью. Отдельные статьи уставов тянут на
  # несколько тысяч символов и в одиночку съедали весь контекст:
  # из двадцати двух статей чек-листа в промпт попадали три.
  max_article_chars: 900

  # Блок «СТАТЬЯ ЦЕЛИКОМ» под ответом: сколько статей показывать и
  # где обрезать длинные. Текст берётся из базы дословно — его можно
  # зачитать сотруднику или экзаменатору, и по нему сразу видно, если
  # модель взяла из статьи не ту строку.
  #
  # 700 символов выбраны по данным: 88% статей короче 400, 95% короче
  # 700. То есть почти всегда статья показывается целиком, а обрезка
  # достаётся редкому длинному хвосту — там дописывается хоткей
  # разворота.
  explain_articles: 4
  # Под ответом печатается суть статьи одной строкой, а не текст
  # целиком: ответ иначе разрастался на экран, а в разговоре с
  # сотрудником читают всё равно не его. Дословный текст — по клавише
  # full_article, и вот его потолок.
  gist_chars: 160
  explain_chars: 1600

  # Вопрос задаётся живой речью, а в базе — юридический язык. Ключ
  # ищется по началу слова, поэтому «мента», «менту», «ментов» ловятся
  # одной записью. Значение ДОПИСЫВАЕТСЯ к запросу, а не заменяет его:
  # если человек всё-таки имел в виду исходное слово, оно продолжает
  # работать. Сленг на сервере живой — пополняйте список здесь.
  slang:
    # Обыск и досмотр разрешает не кодекс, а ордер: SA, AS, AR.
    # Без этой связки «имеет ли право обыскать машину» уводило
    # в Закон «Об охоте» — там тоже осмотр и изъятие, но не то.
    обыск: "ордер на обыск авторизация Search Access"
    обыщ: "ордер на обыск авторизация Search Access"
    досмотр: "ордер на обыск авторизация Search Access"
    # «Полицейский» — обычное слово, но в законе его нет: там
    # «сотрудник государственной организации». Без этой связки вопрос
    # «убил полицейского» уводило в Процессуальный кодекс про
    # задержание, а нужная статья 17.1 не попадала в выдачу вовсе.
    # Без «представитель власти»: с ним первое место перехватывала
    # статья про сотрудника EMS, который «выступает в качестве
    # представителя государственной власти». Замерено на трёх вопросах —
    # короткая расшифровка выигрывает во всех.
    полицейск: "сотрудник государственной организации"
    полисмен: "сотрудник государственной организации"
    # Только «убийство»: «посягательство на жизнь» здесь стояло зря.
    # Так называется статья 17.1 — убийство СОТРУДНИКА, и она
    # вылезала на любой выстрел. На «бабка пристрелила воров» бот
    # отвечал 17.1, хотя никаких сотрудников в деле не было.
    # Когда речь правда о полицейском, его подставит связка
    # «полицейск» → «сотрудник государственной организации».
    убил: "убийство"
    убива: "убийство"
    застрел: "убийство"
    пристрел: "убийство"
    мент: "сотрудник полиции представитель власти"
    мусор: "сотрудник полиции представитель власти"
    коп: "сотрудник полиции представитель власти"
    полицай: "сотрудник полиции представитель власти"
    обозв: "оскорбление унижение чести и достоинства"
    обматер: "оскорбление унижение чести и достоинства"
    нахам: "оскорбление унижение чести и достоинства"
    оскорб: "оскорбление унижение чести и достоинства"
    посад: "лишение свободы наказание"
    закро: "лишение свободы наказание"
    сяд: "лишение свободы наказание"
    скрут: "задержание"
    тачк: "транспортное средство"
    ствол: "огнестрельное оружие"
    пушк: "огнестрельное оружие"
    бабл: "денежные средства"
    # «бабки» из словаря убраны совсем: «у бабки украли» — это
    # бабушка, а не деньги, и различить их по началу слова нельзя.
    # Потеря невелика: про деньги спрашивают словами «бабло», «нал»,
    # «деньги», а рядом почти всегда стоит «украли» или «отжали»,
    # по которым статья и находится.
    бабло: "денежные средства"
    нарк: "наркотические средства"
    взятк: "взяточничество коррупция"
    занес: "взяточничество коррупция"
    грохн: "убийство"
    пришил: "убийство"
    завал: "убийство"
    отжал: "грабёж разбой"
    отжат: "грабёж разбой"
    гнал: "превышение скорости"
    обезьянник: "изолятор временного содержания"
    кпз: "изолятор временного содержания"
    # Не сленг, а устойчивые ошибки распознавания. Найдены утилитой
    # tools/slang_candidates.py по безответным вопросам из истории.
    # Ключ «холодност», а не «холодн»: иначе сюда попало бы законное
    # «холодное оружие».
    хладност: "халатность неисполнение должностных обязанностей"
    холодност: "халатность неисполнение должностных обязанностей"
    поцсуальн: "процессуальный кодекс"
    процесуальн: "процессуальный кодекс"
    посуальн: "процессуальный кодекс"
    задержанност: "задержанный права задержанного"
    задержаност: "задержанный права задержанного"
    дрожжн: "дорожный кодекс"
    дорожн: "дорожный кодекс"
    обонял: "обгон обогнал"
    обагнал: "обгон обогнал"
    сплошн: "сплошная линия разметки выезд на встречную полосу"
    стуля: "составляет"
    стул: "составляет"

  # Множитель очков по типу документа: кодекс, закон, устав, прочее.
  # Применяется, когда спрашивают про наказание: на вопрос «что будет
  # за оскорбление полицейского» нужна статья кодекса, а не пункт
  # внутреннего устава LSPD — тот про дисциплину сотрудника, а не про
  # ответственность гражданина.
  document_bonus: [1.6, 1.3, 1.0, 1.0]

  # Поправка на частоту использования документа. Считается не по
  # тому, что нашлось поиском, а по тому, на что сослался готовый
  # ответ: нашлось шесть статей, пригодилась одна — её документ
  # и становится «ходовым». Растёт логарифмом, поэтому разница
  # между первым и вторым обращением заметна, а между сотым и
  # двухсотым — нет: привычный кодекс не должен перевешивать
  # точное попадание в редкий закон. 0 полностью отключает учёт.
  usage_weight: 0.15
  # Модель эмбеддингов. Считает Ollama, а не sentence-transformers:
  # сервер и так запущен, а sentence-transformers потянул бы torch
  # на два с половиной гигабайта.
  embedding_model: bge-m3
  embedding_batch: 32

# ---------------------------------------------------------------------
# РЕЖИМ АДВОКАТА (ТЗ 5.4, этап 7)
#   Чек-лист процессуальных требований не зашит текстом: под каждую
#   тему в базе ищется реальная статья. Поэтому он остаётся верным
#   после обновления кодекса, а ссылки в вопросах указывают на то,
#   что действительно есть в базе.
#   Темы можно править, добавлять и убирать — код менять не нужно.
# ---------------------------------------------------------------------
lawyer:
  articles_per_topic: 2       # статей на пункт; больше — раздувает промпт
  # Роль, с которой открывается режим. Сменить можно щелчком по
  # надписи в окне, не выходя из режима.
  default_role: detained
  roles:
    # Задержали меня самого: вопросы задаются от первого лица.
    detained:
      title: "Задержали меня"
      hint: "Вопросы сотруднику от первого лица"
      checklist:
        - key: основание
          title: "Основание задержания"
          question: "Согласно {ссылка}, назовите основание моего задержания: вы стали непосредственным очевидцем правонарушения либо поступило обращение от потерпевшего?"
          query: "основания для задержания подозреваемого инициировать следствие"
          expected: "Названо конкретное основание: застигнут на месте, следы преступления, видеофиксация или ордер. «Просто проверка» основанием не является."
        - key: права
          title: "Зачитывание прав (правило Миранды)"
          question: "Согласно {ссылка}, подтвердите, что мне были зачитаны мои права до начала следственных действий. Если нет, все полученные показания являются недопустимым доказательством."
          query: "права задержанного зачитаны до допроса недопустимые доказательства правило Миранды"
          expected: "Права зачитаны до следственных действий. Не зачитаны — всё сказанное вами недопустимое доказательство."
        - key: представился
          title: "Сотрудник представился"
          question: "Согласно {ссылка}, прошу вас представиться, назвать должность и предъявить служебное удостоверение либо жетон."
          query: "сотрудник обязан представиться назвать должность при обращении к гражданину"
          expected: "Назвал структуру, отдел, номер и инициалы, показал жетон или удостоверение."
        - key: адвокат
          title: "Право на адвоката"
          question: "Согласно {ссылка}, требую предоставить мне право на адвоката до начала любых следственных действий."
          query: "право задержанного на адвоката защитника юридическую помощь"
          expected: "Согласие предоставить адвоката и звонок. Отказ — прямое нарушение."
        - key: допрос
          title: "Порядок и лимиты допроса"
          question: "Согласно {ссылка}, назовите время начала допроса и подтвердите соблюдение лимитов: не более трёх сотрудников в комнате и установленной продолжительности."
          query: "порядок проведения допроса подозреваемого количество сотрудников время допроса не может превышать"
          expected: "Названо время начала, в комнате не больше трёх сотрудников, лимит времени соблюдён."
        - key: обыск
          title: "Основание для обыска и досмотра"
          question: "Согласно {ссылка}, предъявите ордер, дающий право на обыск, либо назовите основание, по которому обыск проведён без ордера."
          query: "ордер SA Search Access право провести законную процедуру полного обыска объекта или лица"
          expected: "Предъявлен ордер SA либо названо основание обыска без ордера. Обыск «на всякий случай» незаконен."
        - key: презумпция
          title: "Презумпция невиновности"
          question: "Согласно {ссылка}, напоминаю: бремя доказывания моей вины лежит на вас, я не обязан доказывать свою невиновность. Какими доказательствами вы располагаете?"
          query: "презумпция невиновности бремя доказывания вины"
          expected: "Названы конкретные доказательства. Фраза «докажите, что не виноваты» — нарушение презумпции."
        - key: видео
          title: "Видеофиксация"
          question: "Согласно {ссылка}, подтвердите наличие видеофиксации моего задержания и её сохранность."
          query: "видеофиксация запись задержания доказательства"
          expected: "Подтверждено, что запись ведётся и хранится 72 часа. «Камера не работала» — повод для жалобы."
        - key: арест
          title: "Порядок ареста и выбор учреждения"
          question: "Согласно {ссылка}, объявите о наличии доказательств моей вины и назовите статью, по которой производится арест, а также место отбытия наказания."
          query: "процедура ареста объявить о доказательствах доставить к месту отбытия наказания"
          expected: "Объявлены доказательства, названа статья и место отбытия, проведён вторичный обыск, заполнена форма."
        # Без этих двух пунктов заключению не на что сослаться в разделе
        # «статья для привлечения сотрудника», и модель начинает её выдумывать.
        - key: ответственность
          title: "Превышение должностных полномочий"
          question: "Согласно {ссылка}, обращаю внимание: выход за пределы должностных полномочий влечёт уголовную ответственность сотрудника. Настаиваю на соблюдении процедуры."
          query: "превышение должностных полномочий совершение должностным лицом действий выходящих за пределы его полномочий"
          expected: "Признание, что процедура обязательна. Раздражение и отказ обсуждать — сигнал фиксировать нарушение."
        - key: обжалование
          title: "Обжалование: обращение в прокуратуру"
          question: "Согласно {ссылка}, предупреждаю: действия сотрудника будут обжалованы обращением в прокуратуру, если нарушение закона подтвердится."
          query: "гражданин заметил нарушение конституции или закона сотрудником государственной организации обращение в прокуратуру"
          expected: "Спокойное принятие. Угрозы или давление в ответ — отдельное нарушение, тоже фиксируйте."

    # Я прибыл к задержанному государственным адвокатом: вопросы
    # задаются от лица защитника, и первым делом нужно то, чего нет
    # у самого задержанного, — доступ к подзащитному и к материалам.
    # Вызывает государственного адвоката сам сотрудник, когда
    # задержанный требует защитника и частного вызвать не может.
    counsel:
      title: "Я государственный адвокат"
      hint: "Вызван к задержанному, действую от лица государства"
      checklist:
        - key: причины
          title: "Разъяснение причин задержания адвокату"
          question: "Согласно {ссылка}, запрашиваю информацию о причинах задержания и ареста моего подзащитного. Прошу назвать статьи, по которым он задержан."
          query: "сотрудник обязан разъяснить задержанному и адвокату информацию о причинах задержания ареста если запрашивается"
          expected: "Названы статьи и обстоятельства задержания подзащитного. Отказ разъяснить адвокату — нарушение."
        - key: наедине
          title: "Встреча с подзащитным наедине"
          question: "Согласно {ссылка}, требую встречи с подзащитным наедине в условиях, обеспечивающих конфиденциальность, до начала следственных действий."
          query: "адвокат беспрепятственно встречаться со своим подзащитным наедине конфиденциальность содержание под стражей"
          expected: "Встреча предоставлена без посторонних. Присутствие сотрудника при беседе недопустимо."
        - key: тайна
          title: "Адвокатская тайна"
          question: "Согласно {ссылка}, напоминаю: требовать от меня раскрытия сведений, составляющих адвокатскую тайну, сотрудник не вправе."
          query: "сотрудники правоохранительных органов не имеют право приказывать адвокату раскрыть сведения адвокатскую тайну"
          expected: "Согласие. Любое требование раскрыть содержание беседы с клиентом незаконно."
        - key: права
          title: "Зачитывались ли права подзащитному"
          question: "Согласно {ссылка}, подтвердите, что моему подзащитному были зачитаны его права до начала следственных действий. Если нет — все полученные показания недопустимы."
          query: "права задержанного зачитаны до допроса недопустимые доказательства правило Миранды"
          expected: "Права зачитаны до следственных действий. Не зачитаны — показания подзащитного недопустимы."
        - key: сроки
          title: "Время задержания и сроки"
          question: "Согласно {ссылка}, назовите точное время начала задержания моего подзащитного и основания приостановки срока, если они были."
          query: "по истечении часа с момента начала задержания подозреваемый подлежит освобождению приостановка срока"
          expected: "Названо точное время начала задержания и основания приостановок. Расплывчатое «недавно» — повод требовать освобождения."
        - key: доказательства
          title: "Доказательства и видеофиксация"
          question: "Согласно {ссылка}, предъявите видеофиксацию правонарушения и задержания, на которой основано обвинение моего подзащитного."
          query: "видеофиксация запись задержания доказательства хранение 72 часа"
          expected: "Предъявлена видеофиксация нарушения и задержания. Нет записи — обвинение держится только на словах."
        - key: обыск
          title: "Основание обыска и изъятого"
          question: "Согласно {ссылка}, предъявите ордер, на основании которого проведён обыск подзащитного, либо назовите основание обыска без ордера."
          query: "ордер SA Search Access право провести законную процедуру полного обыска объекта или лица"
          expected: "Предъявлен ордер SA либо названо законное основание обыска без него."
        - key: опрос
          title: "Сбор сведений по делу"
          question: "Согласно {ссылка}, я вправе собирать сведения и опрашивать лиц по делу. Прошу предоставить сведения, на которых построено обвинение."
          query: "адвокат собирать сведения необходимые для оказания юридической помощи опрашивать лиц с их согласия"
          expected: "Доступ к материалам, на которых построено обвинение. Препятствовать сбору сведений сотрудник не вправе."
        - key: приостановка
          title: "Приостановка срока на время адвоката"
          question: "Согласно {ссылка}, течение срока задержания приостановлено на время ожидания ответа государственного адвоката и его прибытия. Подтвердите, что отсчёт остановлен."
          query: "ожидание ответа государственного адвоката 5 минут прибытие адвоката 10 минут приостановка течения срока"
          expected: "Подтверждено, что отсчёт остановлен на время вызова и прибытия адвоката."
        - key: отказ
          title: "Отказ в предоставлении адвоката"
          question: "Согласно {ссылка}, отказывать задержанному в предоставлении адвоката запрещено, если адвокат готов на встречу. Я готов — прошу обеспечить встречу."
          query: "запрещено отказывать заключенным в предоставлении адвоката если адвокат готов на встречу"
          expected: "Встреча обеспечена. Отказ при готовом адвокате прямо запрещён."
        - key: ответственность
          title: "Превышение должностных полномочий"
          question: "Согласно {ссылка}, обращаю внимание: выход за пределы должностных полномочий влечёт уголовную ответственность сотрудника."
          query: "превышение должностных полномочий совершение должностным лицом действий выходящих за пределы его полномочий"
          expected: "Признание, что процедура обязательна. Давление в ответ — отдельное нарушение."
        - key: обжалование
          title: "Обжалование: обращение в прокуратуру"
          question: "Согласно {ссылка}, предупреждаю: нарушения будут обжалованы обращением в прокуратуру от имени моего подзащитного."
          query: "гражданин заметил нарушение конституции или закона сотрудником государственной организации обращение в прокуратуру"
          expected: "Спокойное принятие. Угрозы адвокату фиксируются отдельно."

# ---------------------------------------------------------------------
# ГЕНЕРАТОР ДОКУМЕНТОВ (ТЗ 5.5, этап 8)
#   Образцы лежат в data/templates/proceedings и data/templates/court,
#   наборы не смешиваются: структура прокурорского дела и судебного
#   документа разная. Добавляются образцы через
#   python tools/add_template.py --clipboard [--court]
# ---------------------------------------------------------------------
documents:
  # Сверка с базой. Документ — не реплика в задержании:
  # здесь важнее полнота, чем скорость, поэтому статей
  # берём с запасом и не режем их коротко.
  articles: 14            # сколько норм искать по надиктовке
  max_article_chars: 1200 # потолок на одну норму в промпте
  max_law_chars: 6500     # общий объём выдержек
  # Нормы, которые нужны почти любой судебной бумаге, но в
  # надиктовке не звучат: сроки обжалования и подсудность.
  always_search:
    - "срок обжалования судебного акта 36 часов апелляционный порядок"
    - "какой суд рассматривает дела окружной апелляционный верховный"
    # За что привлекают самого сотрудника. Без этих запросов поиск по
    # надиктовке приносил только процессуальные нормы — как положено
    # задерживать, — а статьи ответственности в выдержки не попадали.
    # Модель дописывала номера по памяти: за «не зачитал права» она
    # проставила УК 6.1, а это нанесение телесных повреждений.
    - "превышение должностных полномочий сотрудником государственной организации"
    - "халатность неисполнение должностных обязанностей сотрудником"
    - "ответственность сотрудника за нарушение процедуры задержания"
    # Срок отстранения сотрудника на время проверки — он стоит
    # в каждом прокурорском деле, а в выдержки по надиктовке
    # не попадал, и сверка ругалась на «120 часов» как на
    # выдуманную величину.
    - "разрешенные сроки отстранения сотрудника от должности"
  # Статьи обвинения бот подбирает сам, а не выбирает моделью:
  # из двух десятков выдержек 14B уверенно брала не ту.
  charge_search:
    - "превышение должностных полномочий сотрудником"
    - "халатность неисполнение должностных обязанностей"
    - "злоупотребление должностными полномочиями"
  max_charges: 4
  # Работа над делом идёт в пять проходов (core/casework.py): разбор
  # на эпизоды, поиск нормы под каждый, черновик, вычитка, правка.
  # Время на это уходит минуты — документ идёт в дело, а не в чат.
  # Бюджет времени на один проход. Проходов пять, и общий потолок
  # означал бы, что один застрявший съедает всё ожидание. Замер на
  # прогретой 14B: разбор на эпизоды — меньше секунды, так что две
  # минуты здесь это запас на загрузку модели, а не рабочее время.
  step_timeout: 120
  max_episodes: 12           # сколько эпизодов выделять из рассказа
  articles_per_episode: 2    # норм под каждый эпизод
  # Приставка к запросу по эпизоду. Без неё «изъял ноутбук без
  # описи» приводит к уставу LSPD про амуницию, а с ней — к
  # статье 4.8.5 Процессуального кодекса об изъятии.
  episode_context: "сотрудник при задержании: "
  episodes_predict: 500      # потолок ответа на разборе
  review: true               # вычитывать черновик отдельным проходом
  review_predict: 600        # потолок ответа вычитки
  predict: 1400              # потолок самого документа
  # Сколько образцов подкладывать в промпт. Прокурорское дело — это
  # две-три тысячи слов; три таких образца вытеснят из окна модели
  # саму надиктовку.
  # Сколько образцов показывать модели. Подбираются не первые попавшиеся,
  # а похожие на надиктовку: судебных документов 29 и они разного вида —
  # определения, решения, приговор, ордер.
  #
  # Три вместо двух: на 5080 подготовка промпта почти ничего не стоит,
  # а третий образец заметно помогает выдержать структуру.
  samples_in_prompt: 3
  max_sample_chars: 9000

# ---------------------------------------------------------------------
# ХРАНИЛИЩЕ
# ---------------------------------------------------------------------
storage:
  legal_db: "data/legal.db"
  history_db: "data/history.db"
  vector_dir: "data/chroma"
  templates_dir: "data/templates"

# ---------------------------------------------------------------------
# ПАРСЕР ПРАВИЛ (ТЗ 5.3)
#   Настроено по реальному Ctrl+A/Ctrl+C страницы «Общие правила
#   проекта». Формат оказался не таким, как предполагало ТЗ: никаких
#   «Статья N» и «Глава N», а сквозная иерархическая нумерация.
#   Шаблоны здесь, чтобы под другие разделы форума (правила фракций,
#   зелёных зон) их можно было править без изменения кода.
# ---------------------------------------------------------------------
legal_parser:
  # Картинка-разделитель, которой форум отбивает заголовок раздела.
  # Заголовком считается строка ПЕРЕД ней. Имя файла не одно:
  # в общих правилах это gta5_divider.png, в правилах допросов —
  # K61Vjxh.png. Поэтому ловим любую строку из одного имени картинки.
  section_marker: '^.{1,120}\.(?:png|gif|jpe?g|webp)$'

  # Номер пункта в начале строки. Два вида нумерации, оба встречаются:
  #   иерархическая — «1.1», «6.26», «1.7.1» (общие правила, зелёные зоны);
  #   плоская       — «1.», «2.», «3.»       («Война за граффити»).
  # Для плоской точка после номера обязательна, иначе под пункт попадут
  # строки вроде «30 Июн 2026» и «2 Авг 2026» из блока автора.
  rule_pattern: '^(\d+(?:\.\d+)+|\d+\.)[.\s]\s*(.+)$'

  # Копирование склеивает заголовок спойлера со следующим пунктом:
  # «...зона запрещенная для агитации6.26 Похищения...».
  # Требуем букву перед номером и заглавную после, иначе порвём
  # безобидные «п.1.1» и «RageMP 4.5».
  glue_pattern: '(?<=[а-яёa-z])(\d+(?:\.\d+)+)\s+(?=[А-ЯЁA-Z])'

  # Границы постов в теме. Всё после первого поста — журнал изменений,
  # он дословно повторяет часть пунктов и должен быть отрезан.
  post_pattern: '^#(\d+)\s*$'

  # Заголовок главы: «Глава I Общие сведения.», «Глава 2. Форма».
  # Третий вид разметки: внутри такой главы пункты идут БЕЗ номеров,
  # обычными предложениями. Без этого шаблона страницы вроде
  # «Пропуска на посещения закрытых территорий» не дают ни одного пункта.
  chapter_pattern: '^\s*Глава\s+([IVXLCDM]+|\d+)[.\s]+(.*)$'

  note_prefixes: ['Примечание:', 'Исключение:', 'Пример:']

  # Служебные строки форума: подвал поста с реакциями и блоком автора.
  # Без них он приклеивается к последнему пункту документа.
  chrome_patterns:
    - '^Like'
    - '^Реакции:'
    - '^Добавить закладку$'
    - '^Поделиться:$'
    - '^Пожаловаться$'
    - '^Отслеживать$'
    - '^Автор темы'
    - '^В этой теме нельзя размещать'
    - '^\[(?:Пункт|Добавлен|Изменен|Удалён|Удален)'
    # Надзаголовок над главами в уставах: «РАЗДЕЛ II — СЛУЖБА...»
    - '(?i)^раздел\s+[IVXLCDM\d]+'

  # По этим словам хвост после «|» опознаётся как санкция.
  # Нужно потому, что «|» встречается и в примерах RP-процесса:
  # «/try взломал замок | Неудачно.» — это не санкция.
  sanction_words:
    - 'блокировк'
    - 'перманент'
    - 'черный список'
    - 'чёрный список'
    - 'обнулени'
    - 'warn'
    - 'варн'
    - 'деморган'
    - 'принудительн'
    - 'запрет'
    - 'смена'
    - 'предупреждени'
    - 'изъяти'
    - 'штраф'
    - 'выговор'
    - 'увольнени'
    - 'разжаловани'
    - 'арест'
    # Фракционные санкции: штрафные баллы фракции и лидеру, мут в чате.
    # Без них 40 пунктов из 461 остались с «|» внутри текста.
    - 'балл'
    - 'мут '
    - 'мут.'
    - 'замут'
    - 'приравнивается'
    # Стем, а не «наказание» целиком: в уставе Нацгвардии санкция
    # записана как «Мера наказания определяется Генералитетом»,
    # и точное слово «наказание» туда не попадает.
    - 'наказани'
    - 'откат'
    # Санкции уставов, которых не было ни в одном кодексе:
    # «Занесение в ЧС Армии», «Отстранение от должности», «Понижение
    # в звании», «Исключение из рядов».
    - 'занесени'
    - 'отстранени'
    - 'понижени'
    - 'исключени'
    - 'наряд'
    # Основная санкция Уголовного кодекса — срок. Без этих слов срок
    # оставался внутри текста статьи: из 142 статей УК санкция была
    # распознана у четырёх.
    - 'лишени'
    - ' лет'
    - ' год'
    - ' года'
    - 'конфискаци'
    - 'исправительн'
    - 'обязательн'

  strip_bbcode: true
  min_rule_length: 20           # короче — скорее всего мусор из оглавления

logging:
  level: INFO
  file: "logs/app.log"

clipboard:
  # Длиннее этого — уже не вопрос, а страница форума:
  # для неё есть импорт в базу.
  max_paste_chars: 4000
